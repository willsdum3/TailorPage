        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .book-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .book-cover {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .book-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .book-author {
            color: #ccc;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status.success {
            background: #22c55e;
            color: white;
        }
        .status.error {
            background: #ef4444;
            color: white;
        }
        .status.loading {
            background: #f59e0b;
            color: white;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>

        function getBookCover(bookId, title, author) {
            // Try manual overrides first
            const possibleOverrideKeys = [
                bookId.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                title.toLowerCase().replace(/[^a-z0-9]/g, '-'),
                `${title.toLowerCase().replace(/[^a-z0-9]/g, '-')}-${author.toLowerCase().replace(/[^a-z0-9]/g, '-')}`,
                title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/\s+/g, '-'),
                title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/\s+/g, ''),
                title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/the-/g, ''),
                title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/a-/g, ''),
                title.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/an-/g, ''),
            ];
            
            for (const overrideKey of possibleOverrideKeys) {
                if (manualCoverOverrides[overrideKey]) {
                    return manualCoverOverrides[overrideKey];
                }
            }
            
            // Fallback to placeholder
            const cleanTitle = title.replace(/[^a-zA-Z0-9\s]/g, '').trim();
            const cleanAuthor = author.replace(/[^a-zA-Z0-9\s]/g, '').trim();
            return `https://via.placeholder.com/300x400/1f2937/ffffff?text=${encodeURIComponent(cleanTitle)}+by+${encodeURIComponent(cleanAuthor)}`;
        }

        function createBookCard(book) {
            const coverUrl = getBookCover(book.id, book.title, book.author);
            const isPlaceholder = coverUrl.includes('placeholder.com');
            
            return `
                <div class="book-card">
                    <img src="${coverUrl}" alt="${book.title}" class="book-cover" onerror="this.src='https://via.placeholder.com/300x400/1f2937/ffffff?text=Error'">
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">by ${book.author}</div>
                    <div class="status ${isPlaceholder ? 'error' : 'success'}">
                        ${isPlaceholder ? 'Placeholder' : 'Cover Found'}
                    </div>
                    <div style="font-size: 0.8em; color: #888; margin-top: 5px;">
                        ID: ${book.id}
                    </div>
                </div>
            `;
        }

        function testAllBooks() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            testBooks.forEach(book => {
                const card = createBookCard(book);
                resultsDiv.innerHTML += card;
            });
            
            const successCount = testBooks.filter(book => {
                const coverUrl = getBookCover(book.id, book.title, book.author);
                return !coverUrl.includes('placeholder.com');
            }).length;
            
            console.log(`Test Results: ${successCount}/${testBooks.length} books have covers (${Math.round(successCount/testBooks.length*100)}%)`);
        }

        function clearCache() {

            alert('Cache cleared!');
        }

        function testSpecificBook() {
            const title = prompt('Enter book title:');
            const author = prompt('Enter author:');
            const id = prompt('Enter book ID (optional):') || title.toLowerCase().replace(/[^a-z0-9]/g, '-');
            
            if (title && author) {
                const book = { id, title, author };
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = createBookCard(book);
                
                const coverUrl = getBookCover(id, title, author);
                console.log(`Cover URL for "${title}": ${coverUrl}`);
            }
        }

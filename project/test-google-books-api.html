<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Books API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 300px; }
        .book-cover { max-width: 200px; margin: 10px; }
    </style>
</head>
<body>
    <h1>Google Books API Test</h1>
    
    <div class="test-result info">
        <strong>API Key Status:</strong> 
        <span id="api-key-status">Checking...</span>
    </div>
    
    <div>
        <input type="text" id="book-title" placeholder="Enter book title" value="The Midnight Library">
        <input type="text" id="book-author" placeholder="Enter book author" value="Matt Haig">
        <button onclick="testGoogleBooksAPI()">Test Google Books API</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        // Check if API key is accessible
        function checkAPIKey() {
            // In a real app, this would come from environment variables
            // For testing, we'll simulate the check
            const apiKey = 'AIzaSyBfzLciShTphvS0okIaH1Dkf623v71gzqc';
            const statusElement = document.getElementById('api-key-status');
            
            if (apiKey && apiKey !== 'your_google_books_api_key_here') {
                statusElement.textContent = '✅ Configured';
                statusElement.style.color = '#155724';
            } else {
                statusElement.textContent = '❌ Missing or Invalid';
                statusElement.style.color = '#721c24';
            }
        }
        
        async function testGoogleBooksAPI() {
            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const resultsDiv = document.getElementById('results');
            
            if (!title || !author) {
                resultsDiv.innerHTML = '<div class="test-result error">Please enter both title and author</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div class="test-result info">Testing API call...</div>';
            
            try {
                const apiKey = 'AIzaSyBfzLciShTphvS0okIaH1Dkf623v71gzqc';
                const query = encodeURIComponent(`${title} ${author}`);
                const url = `https://www.googleapis.com/books/v1/volumes?q=${query}&key=${apiKey}`;
                
                console.log('Making API call to:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            <strong>API Error:</strong> ${data.error.message}
                            <br>Code: ${data.error.code}
                        </div>
                    `;
                    return;
                }
                
                if (data.items && data.items.length > 0) {
                    const book = data.items[0];
                    const coverUrl = book.volumeInfo.imageLinks?.thumbnail || 'No cover available';
                    
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            <strong>✅ API Call Successful!</strong>
                            <br>Found: ${book.volumeInfo.title} by ${book.volumeInfo.authors?.join(', ') || 'Unknown'}
                            <br>Total Results: ${data.totalItems}
                        </div>
                        <div>
                            <h3>Book Cover:</h3>
                            ${coverUrl !== 'No cover available' 
                                ? `<img src="${coverUrl}" alt="Book Cover" class="book-cover">` 
                                : '<p>No cover image available</p>'
                            }
                        </div>
                        <div>
                            <h3>Raw API Response:</h3>
                            <pre style="background: #f8f9fa; padding: 10px; overflow-x: auto; font-size: 12px;">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result info">
                            <strong>No books found</strong> for "${title}" by "${author}"
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('API test error:', error);
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        <strong>Error:</strong> ${error.message}
                        <br>This might be a CORS issue or network problem
                    </div>
                `;
            }
        }
        
        // Check API key status on page load
        checkAPIKey();
    </script>
</body>
</html>
